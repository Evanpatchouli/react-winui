name: Publish Node.js package

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build library
        run: pnpm build:library

      - name: Pack npm package
        run: pnpm --filter @evanpatchouli/react-winui pack --pack-destination artifacts

      - name: Upload package
        uses: actions/upload-artifact@v6
        with:
          name: npm-package
          path: artifacts/*.tgz

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: npm

    steps:
      - name: Download package
        uses: actions/download-artifact@v7
        with:
          name: npm-package
          path: artifacts

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      - name: Verify npm token exists
        run: test -n "$NODE_AUTH_TOKEN"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify npm identity
        run: npm whoami --registry=https://registry.npmjs.org/
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm
        run: npm publish artifacts/*.tgz --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
